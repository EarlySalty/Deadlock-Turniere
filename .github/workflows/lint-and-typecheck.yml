name: "Frontend CI"

on:
  pull_request:
    branches: [ "main", "master", "develop" ]
    paths:
      - "frontend/**"
      - ".github/workflows/lint-and-typecheck.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-ci:
    name: "Frontend CI"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint changed frontend files
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mapfile -t changed < <(
            git diff --name-only "$BASE_SHA" HEAD -- frontend |
              grep -E '\.(cjs|mjs|js|jsx|ts|tsx)$' || true
          )
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "No changed lintable frontend files."
            exit 0
          fi
          relative=()
          for file in "${changed[@]}"; do
            relative+=("${file#frontend/}")
          done
          cd frontend
          npx eslint "${relative[@]}"

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build
