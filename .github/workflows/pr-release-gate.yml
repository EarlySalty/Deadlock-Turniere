name: "PR Manual Review Audit"

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

concurrency:
  group: pr-manual-review-audit-${{ github.repository }}
  cancel-in-progress: false

jobs:
  audit:
    name: "Read-only PR audit"
    runs-on: ubuntu-latest
    steps:
      - name: Audit pull requests for manual review
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const requiredChecks = [
              "Semantic review",
              "Frontend CI",
              "Rust workspace and isolated PostgreSQL",
              "Secret Detection",
              "JavaScript Dependency Audit",
              "Semgrep SAST",
              "CodeQL Analysis (javascript-typescript)",
              "Trivy Filesystem Scan",
            ];

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });

            for (const listed of pulls) {
              const pull_number = listed.number;
              let pr = (await github.rest.pulls.get({ owner, repo, pull_number })).data;

              if (pr.base.ref !== "main" || pr.draft) {
                core.notice(`PR #${pull_number}: base is not main or the PR is a draft.`);
                continue;
              }
              if (pr.head.repo?.full_name !== `${owner}/${repo}`) {
                core.notice(`PR #${pull_number}: fork branch needs independent manual review; this audit covers same-repository branches only.`);
                continue;
              }

              const permissionResponse = await github.rest.repos.getCollaboratorPermissionLevel({
                owner,
                repo,
                username: pr.user.login,
              });
              const trustedPermissions = new Set(["admin", "maintain", "write"]);
              if (!trustedPermissions.has(permissionResponse.data.permission)) {
                core.notice(
                  `PR #${pull_number}: author ${pr.user.login} lacks trusted write permission (${permissionResponse.data.permission}).`,
                );
                continue;
              }

              const changedFiles = await github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number,
                per_page: 100,
              });
              // GitHub truncates listFiles after 3,000 entries. Never decide the
              // policy-path rule from a partial file list.
              if (!Number.isSafeInteger(pr.changed_files) || pr.changed_files < 1 ||
                  changedFiles.length !== pr.changed_files) {
                core.notice(`PR #${pull_number}: changed-file list is incomplete or inconsistent.`);
                continue;
              }
              const protectedPolicyPath = (filename) =>
                filename.startsWith(".github/") ||
                filename.startsWith("scripts/ci/") ||
                /^rust\/scripts\/(?:central_ci|central_fresh_schema|central_test_db|check)\.sh$/.test(filename);
              const incompleteFileData = changedFiles.some((file) =>
                typeof file.filename !== "string" || !file.filename ||
                (file.status === "renamed" &&
                  (typeof file.previous_filename !== "string" || !file.previous_filename)),
              );
              if (incompleteFileData) {
                core.notice(`PR #${pull_number}: incomplete file or rename metadata requires manual review.`);
                continue;
              }
              // A rename removes policy from its old path even when the new path is ordinary code.
              const protectedChanges = [...new Set(changedFiles
                .flatMap((file) => [file.filename, file.previous_filename])
                .filter((filename) => typeof filename === "string" && protectedPolicyPath(filename)))];
              if (protectedChanges.length) {
                core.notice(
                  `PR #${pull_number}: trusted manual bootstrap required for CI/release-policy files: ${protectedChanges.join(", ")}`,
                );
                continue;
              }

              const evaluatedSha = pr.head.sha;
              const evaluatedBaseSha = pr.base.sha;
              const mainRef = await github.rest.git.getRef({ owner, repo, ref: "heads/main" });
              if (mainRef.data.object.sha !== evaluatedBaseSha) {
                core.notice(`PR #${pull_number}: main moved before gate evaluation. Re-evaluation required.`);
                continue;
              }
              const comparison = await github.request(
                "GET /repos/{owner}/{repo}/compare/{basehead}",
                {
                  owner,
                  repo,
                  basehead: `${evaluatedBaseSha}...${evaluatedSha}`,
                },
              );

              if ((comparison.data.behind_by || 0) > 0) {
                core.notice(`PR #${pull_number}: branch is behind main; update it and rerun all checks before manual review.`);
                continue;
              }

              if (pr.mergeable !== true || pr.mergeable_state === "dirty") {
                core.notice(`PR #${pull_number}: mergeability is not clean yet.`);
                continue;
              }

              // listForRef only searches the 1,000 most recent check suites.
              // Count all suites first and require a margin below that boundary.
              const checkSuites = await github.paginate(github.rest.checks.listSuitesForRef, {
                owner,
                repo,
                ref: evaluatedSha,
                per_page: 100,
              });
              if (checkSuites.length >= 1000) {
                core.notice(`PR #${pull_number}: too many check suites for complete check-run evaluation.`);
                continue;
              }
              const checkRuns = await github.paginate(github.rest.checks.listForRef, {
                owner,
                repo,
                ref: evaluatedSha,
                filter: "latest",
                per_page: 100,
              });
              const trustedActionChecks = checkRuns.filter(
                (check) =>
                  check.head_sha === evaluatedSha &&
                  check.app?.slug === "github-actions",
              );
              const byName = new Map(
                trustedActionChecks.map((check) => [check.name, check]),
              );

              const missingRequired = requiredChecks.filter((name) => !byName.has(name));
              const incompleteRequired = requiredChecks.filter((name) => {
                const check = byName.get(name);
                return check && (check.status !== "completed" || check.conclusion !== "success");
              });
              if (missingRequired.length || incompleteRequired.length) {
                core.notice(
                  `PR #${pull_number}: trusted required Actions checks not ready. missing=${missingRequired.join(",") || "none"} incomplete=${incompleteRequired.join(",") || "none"}.`,
                );
                continue;
              }

              const acceptedAncillaryConclusions = new Set(["success", "neutral", "skipped"]);
              const blockingCheckRuns = checkRuns.filter(
                (check) =>
                  check.head_sha === evaluatedSha &&
                  (
                    check.status !== "completed" ||
                    !acceptedAncillaryConclusions.has(check.conclusion || "")
                  ),
              );
              if (blockingCheckRuns.length) {
                core.notice(
                  `PR #${pull_number}: other check runs are not green: ${blockingCheckRuns.map((check) => `${check.name}=${check.status}/${check.conclusion || "pending"}`).join(", ")}.`,
                );
                continue;
              }

              const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
                owner,
                repo,
                ref: evaluatedSha,
                per_page: 100,
              });
              const latestStatusByContext = new Map();
              for (const status of statuses) {
                const previous = latestStatusByContext.get(status.context);
                if (
                  !previous ||
                  new Date(status.created_at || 0).getTime() >
                    new Date(previous.created_at || 0).getTime()
                ) {
                  latestStatusByContext.set(status.context, status);
                }
              }
              const blockingStatuses = [...latestStatusByContext.values()].filter(
                (status) => status.state !== "success",
              );
              if (blockingStatuses.length) {
                core.notice(
                  `PR #${pull_number}: commit statuses are not green: ${blockingStatuses.map((status) => `${status.context}=${status.state}`).join(", ")}.`,
                );
                continue;
              }

              pr = (await github.rest.pulls.get({ owner, repo, pull_number })).data;
              if (pr.state !== "open" || pr.draft || pr.base.ref !== "main" ||
                  pr.head.sha !== evaluatedSha || pr.base.sha !== evaluatedBaseSha ||
                  pr.head.repo?.full_name !== `${owner}/${repo}`) {
                core.notice(`PR #${pull_number}: PR, head or base changed after gate evaluation. Re-evaluation required.`);
                continue;
              }
              const finalMainRef = await github.rest.git.getRef({ owner, repo, ref: "heads/main" });
              if (finalMainRef.data.object.sha !== evaluatedBaseSha) {
                core.notice(`PR #${pull_number}: main moved during the audit. Re-evaluation required.`);
                continue;
              }
              core.notice(`PR #${pull_number}: recorded gates are green at ${evaluatedSha}; independent manual review and merge are required.`);
            }
