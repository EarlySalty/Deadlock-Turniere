# Globale Betriebskonfiguration für Deadlock-Turniere.
# Änderungen benötigen einen geordneten Neustart. Kein Hot-Reload.
# Secrets gehören in Infisical. Turniere und Anmeldungen bleiben in Postgres.
# Relative Datenpfade beginnen beim Verzeichnis dieser Datei.
# WIP: vollständiger Abgleich der produktiven Prioritätskette noch offen.
