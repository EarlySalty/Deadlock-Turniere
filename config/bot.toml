routine_tournament_bracket_delay_minutes = 180

[logging]
level = "info"

[network]
broker_request_seconds = 20
broker_connect_seconds = 5
oauth_request_seconds = 20
oauth_connect_seconds = 5
steam_discord_request_seconds = 10
lobby_provision_seconds = 25
lobby_request_seconds = 10
lobby_connect_seconds = 5
scrim_lobby_code_seconds = 25
scrim_role_sync_seconds = 20
observer_request_seconds = 5
observer_connect_seconds = 5
observer_keepalive_seconds = 30
heroes_request_seconds = 5

[scheduler]
tick_seconds = 60
routine_seconds = 3600
scrim_operational_seconds = 15
lobby_tick_seconds = 5
lobby_reconcile_seconds = 15
lobby_collect_seconds = 30
observer_tick_milliseconds = 2000
observer_evaluate_milliseconds = 350
observer_stale_seconds = 10
observer_startup_grace_seconds = 20

# [observer_agent] wird auf einem tatsächlich eingerichteten Agenten ergänzt.
# Ohne diese Sektion startet der eigenständige Agent nicht.

[assets]
heroes_url = "https://api.deadlock-api.com/v1/assets/heroes"
heroes_cache_seconds = 86400
heroes_fallback_cache_seconds = 60

[limits]
# Neue Sessions: 1 bis 30 Tage. Bestehende Ablaufzeiten bleiben unverändert.
session_lifetime_days = 7
# Upload maximal 16 MiB; API-Nutzlast maximal 1 MiB.
avatar_bytes = 2097152
request_body_bytes = 2097152
comp_body_bytes = 32768
comp_clients = 10000
comp_reads_per_minute = 600
comp_writes_per_minute = 120
comp_creations_per_hour = 10
draft_creations_per_hour = 10
draft_viewer_ttl_seconds = 20

[authorization]
# Freigaberollen für Vorschläge. Laufende Abstimmungen bleiben in Postgres.
proposal_approver_role_ids = ["1337518124647579661", "1401891955931222110"]

[steam]
discord_api_base_url = "https://discord.com/api/v10"
# Reihenfolge: Initiate, Seeker, Alchemist, Arcanist, Ritualist, Emissary,
# Archon, Oracle, Phantom, Ascendant, Eternus. Unterrangrollen bleiben in der DB.
main_rank_role_ids = [
  1331457571118387210, 1331457652877955072, 1331457699992436829,
  1331457724848017539, 1331457879345070110, 1331457898781474836,
  1331457949654319114, 1316966867033653338, 1331458016356208680,
  1331458049637875785, 1331458087349129296,
]
rank_cache_seconds = 86400
subrank_role_cache_seconds = 300

[bridge]
# Bestehende externe Steam-Bridge. Keine neue Turnier-Persistenz.
busy_timeout_seconds = 5
poll_milliseconds = 500
stale_task_milliseconds = 120000


[database]
# DSN bleibt in Infisical. Keine Migration beim normalen Start.
max_connections = 8
acquire_timeout_seconds = 10
