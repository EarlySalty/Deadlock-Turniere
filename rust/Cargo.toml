# Deadlock-Turniere — Rust-Neuentwicklung (alles unter /rust).
#
# Cargo-Workspace: ein Manifest, viele kleine Crates mit je EINER klaren
# Zuständigkeit (keine Monolithen). Versionen zentral in [workspace.dependencies],
# damit alle Crates denselben Stand teilen.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Deutsche Deadlock Community"]
repository = "https://github.com/EarlySalty/Deadlock-Turniere"

[workspace.dependencies]
# --- Fundament ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
chrono-tz = "0.10"

# --- Async / Laufzeit ---
# Statt "full": nur die tatsächlich genutzten Bausteine (tokio::main/test,
# ::net (TcpListener), ::fs, ::signal::ctrl_c, ::sync (watch/Barrier), ::time
# (sleep/interval)). rt-multi-thread bewahrt den Standard-Multithread-Scheduler
# von #[tokio::main] (kein Verhaltenswechsel).
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "fs",
    "signal",
    "sync",
    "time",
] }
futures = "0.3"
async-trait = "0.1"

# --- Persistenz ---
# Zentrale Postgres/TimescaleDB. Produktive Queries werden im SP4-Verlauf auf
# voll qualifizierte PG-Queries portiert; der SQLx-Offline-Cache liegt in
# rust/.sqlx. Siehe backend/docs/plans/2026-07-01-sp4-turniere-central-db.md.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "chrono",
    "json",
    "macros",
    "migrate",
] }

# --- Web ---
# ws/macros (axum) und typed-header (axum-extra) und fs/trace (tower-http)
# sind im Code unbenutzt (kein WebSocket, kein #[debug_handler], keine
# TypedHeader-Extraktion, kein ServeDir/ServeFile, kein TraceLayer) -> entfernt.
axum = { version = "0.8", features = ["multipart"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }

# --- Netz / externe Dienste ---
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# --- Observability ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# --- Hilfen ---
rand = "0.8"
base64 = "0.22"
once_cell = "1"

# Interne Crates referenzieren sich über path-Deps (siehe jeweilige Cargo.toml).
dl-central-db = { path = "../../Deadlock-Bots/rust/crates/dl-central-db" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true
