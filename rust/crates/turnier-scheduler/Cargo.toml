[package]
name = "turnier-scheduler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Hintergrund-Loop des Turnier-Backends: schiebt Turniere automatisch durch ihren
# Lebenszyklus (draft → registration → checkin → group_phase → bracket), sobald die
# jeweiligen Zeitstempel fällig sind, und verschickt drei Klassen von Erinnerungs-DMs
# (Registrierungs-/Start-/Match-Reminder). Beim Phasenwechsel werden Gruppen/Matches/
# Bracket generiert, Auto-Lobbys geplant, Punkte bei Abschluss neu berechnet und alles
# im Audit-Log protokolliert. Die geteilte Orchestrierung advance_tournament_status
# wird auch von turnier-api (Admin-Routen) aufgerufen.
[features]
default = []
testing = ["turnier-db/testing", "turnier-automatik/testing"]

[dependencies]
turnier-core = { path = "../turnier-core" }
turnier-db = { path = "../turnier-db" }
turnier-config = { path = "../turnier-config" }
turnier-discord = { path = "../turnier-discord" }
turnier-engine = { path = "../turnier-engine" }
turnier-match = { path = "../turnier-match" }
turnier-automatik = { path = "../turnier-automatik" }

sqlx.workspace = true
tokio.workspace = true
chrono.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
turnier-db = { path = "../turnier-db", features = ["testing"] }
tokio = { workspace = true }

[lints]
workspace = true
