[package]
name = "turnier-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Die Turnier-Engine — das Herz des Backends. Trennt strikt die REINEN
# Algorithmen (Seeding, Bracket-Verdrahtung Single/Double-Elim, Mini-Group-
# Verteilung, Snake-Draft, Tiebreaker, Punkte-Platzierung — alles DB-frei und
# voll unit-testbar) von der sqlx-Persistenz (build_*_bracket, generate_groups,
# finalize_checkin, advance_bracket_winner). Jede öffentliche Persistenz-
# Operation läuft in EINER Transaktion. Determinismus über injizierbaren
# StdRng. 1:1-Parität zum Python-Original (backend/tournament/*.py), bewiesen
# durch die portierten Paritätstests unter tests/.
[dependencies]
turnier-core = { path = "../turnier-core" }
turnier-db = { path = "../turnier-db", optional = true }
turnier-steam = { path = "../turnier-steam", optional = true }

sqlx = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
thiserror.workspace = true
async-trait = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
serde_json.workspace = true

[dev-dependencies]
tokio = { workspace = true }

[features]
default = ["persist"]
persist = [
    "dep:async-trait",
    "dep:chrono",
    "dep:rand",
    "dep:sqlx",
    "dep:tracing",
    "dep:turnier-db",
    "dep:turnier-steam",
    "sqlx/sqlite",
]

[lints]
workspace = true
