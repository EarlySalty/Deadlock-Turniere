tb-match = { path = "../tb-match" }
tb-scheduler = { path = "../tb-scheduler" }
tb-web = { path = "../tb-web" }

tokio.workspace = true
axum.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true

[lints]
workspace = true
